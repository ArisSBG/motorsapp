; Scans et PDF : jusqu'à 20 Mo par fichier
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

date.timezone = Africa/Ouagadougou
expose_php = Off

; Sessions protégées
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
